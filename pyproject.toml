[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "onco-agent-research"
version = "0.2.0"
description = "Auditable tool-using histopathology research pipeline (not clinical software)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.1", "torchvision>=0.16", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.7"]
dashboard = ["streamlit>=1.38", "pandas>=2.0"]
[project.scripts]
onco-agent = "onco_agent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
